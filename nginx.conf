# Sau Cloudflare Tunnel, nginx chỉ nhận HTTP nên $scheme luôn là "http". Giữ nguyên
# X-Forwarded-Proto do Cloudflare gửi (https) để Spring dựng đúng redirect_uri OAuth2
# (https://.../login/oauth2/code/google), nếu không Google báo redirect_uri_mismatch.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Cho phép upload ảnh gốc tới 50MB (RAW) + dư cho multipart overhead.
    # Mặc định nginx chỉ cho 1MB -> lỗi 413. Khớp spring.servlet.multipart.max-file-size.
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # DNS nội bộ của Docker. Dùng biến trong proxy_pass để nginx KHÔNG chết lúc khởi động
    # khi container "backend" chưa chạy (phân giải khi có request; api chưa lên -> 502
    # -> hiện /error.html thay vì crash-loop "host not found in upstream").
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend cũ vẫn redirect popup về /oauth2/callback?token=... -> phục vụ trang tĩnh
    # postMessage/đóng popup thay vì để SPA tự load trong popup (query string được giữ nguyên).
    location = /oauth2/callback {
        try_files /oauth2-callback.html =404;
    }

    # Khi backend không tới được (chưa start / crash / timeout), thay vì trang lỗi
    # mặc định xấu xí của nginx, hiện popup thông báo thân thiện (public/error.html,
    # được Vite copy nguyên vẹn vào dist/ khi build). Áp dụng cho mọi location proxy
    # phía dưới (đặc biệt các navigation cả trang như /oauth2/authorization/google).
    error_page 502 503 504 /error.html;
    location = /error.html {
        root /usr/share/nginx/html;
        internal;
    }

    location /api/ {
        set $backend_upstream http://backend:8310;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # CHỈ proxy /oauth2/authorization/ (endpoint khởi tạo OAuth2 Login của Spring
    # Security) — KHÔNG proxy bare /oauth2/ vì sẽ nuốt luôn route /oauth2/callback
    # của chính SPA (App.tsx tự đọc token từ query string ở route này), khiến
    # request bị đẩy nhầm sang backend và lỗi NoResourceFoundException.
    location /oauth2/authorization/ {
        set $backend_upstream http://backend:8310;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /login/oauth2/ {
        set $backend_upstream http://backend:8310;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
