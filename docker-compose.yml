services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: travelphoto-web
    image: travelphoto-web:latest
    restart: unless-stopped
    ports:
      # Quy tac [PP][SS]: travelphoto = ma 83 -> WEB 8300. Chi bind localhost
      # (public qua Cloudflare Tunnel). Nginx trong container van listen 80.
      - "127.0.0.1:${WEB_PORT:-8300}:80"
    networks:
      - internal

networks:
  # Mang noi bo du an dung chung web + api.
  # Tao 1 lan tren server: docker network create travelphoto-net
  internal:
    name: travelphoto-net
    external: true
